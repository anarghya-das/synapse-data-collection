# Usable cohort as of the 2026-08-28 QC run (windowed correlation criterion +
# duplicate-channel detection + R07 excluded from the score).
#
# Rule: >= 4 INDEPENDENT channels, i.e. channels that are neither faulty nor a
# duplicate of another channel — the study's own inclusion bar, applied to the
# corrected QC. 28 EXP + 15 CTRL = 43.
#
# Excluded (7): CTRL11, CTRL13, CTRL14, CTRL15, CTRL16, EXP12, EXP14 — every
# channel railed (a single REF/BIAS failure each; see docs/recording_rig_faults.md).
# Also absent: CTRL03, EXP26 (no EEG stream), EXP44 (empty stream), EXP32
# (Neurable, not OpenBCI-scorable).
#
# CAVEAT — EXP47 and CTRL27 are kept deliberately. Their right grid duplicates
# the left, so they carry 7 independent channels with an UNVERIFIED EAR LABEL.
# Fine for a non-spatial analysis (the duplicate copies are flagged bad and get
# masked); do NOT use them for anything per-ear or per-electrode-position, and
# do NOT use channel_strategy=interpolate on them.
