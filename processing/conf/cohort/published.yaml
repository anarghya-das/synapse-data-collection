# The exact cohort used in the published analysis (synapse_preprocessed.pkl:
# exp_subjects / ctrl_subjects). Use this to reproduce / compare.
name: published
# Reproduction fidelity: build the published mirror from the same clinical
# workbook the published pkl used (Apr 2026 state), NOT the newer default
# 02_PCData.xlsx. Overrides paths.clinical_data (see build_dataset.py).
# null => use paths.clinical_data (the current workbook). The epoch data still
# reproduces the published pkl exactly; only the clinical_* keys differ, since
# the workbook has grown since the paper. Set an explicit path here if you need
# those to match the paper too.
clinical_data: null
exp:
  - EXP01
  - EXP02
  - EXP03
  - EXP04
  - EXP05
  - EXP06
  - EXP07
  - EXP11
  - EXP13
  - EXP15
  - EXP16
  - EXP18
  - EXP21
  - EXP22
  - EXP23
  - EXP25
  - EXP28
  - EXP29
ctrl:
  - CTRL01
  - CTRL02
  - CTRL06
  - CTRL07
  - CTRL08
  - CTRL10
  - CTRL17
  - CTRL18
  - CTRL20
  - CTRL21
