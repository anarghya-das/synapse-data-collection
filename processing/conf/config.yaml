# =============================================================================
# SYNAPSE dataset-builder configuration (Hydra)
# =============================================================================
# Build processed-data variants for model ingestion:
#   python -m pipelines.build_dataset cohort=published preprocessing=published
#   python -m pipelines.build_dataset preprocessing=interpolate
#   python -m pipelines.build_dataset --multirun preprocessing=published,interpolate,zero_mask
#   python -m pipelines.build_dataset cohort.ids='[EXP01,EXP13,CTRL10]'   # ad-hoc subset
#
# Compare a built variant against the original published pkl:
#   python -m pipelines.compare variant=published
# =============================================================================

defaults:
  - cohort: published          # which participant IDs to process
  - preprocessing: published   # how to process them (the variant)
  - _self_

# Keep the working directory unchanged (so our relative paths resolve) and corral
# Hydra's run log + metadata under <base>/outputs/logs/ (base = $SYNAPSE_DATA_BASE,
# else the repo) instead of littering the repo root.
hydra:
  run:
    dir: ${oc.env:SYNAPSE_DATA_BASE,.}/outputs/logs/${hydra.job.name}
  sweep:
    dir: ${oc.env:SYNAPSE_DATA_BASE,.}/outputs/logs/${hydra.job.name}
    subdir: ${hydra.job.num}
  output_subdir: null
  job:
    chdir: false

# Variant identity is two-dimensional (cohort x preprocessing) and names the
# output dir outputs/epochs/<variant>/ (epochs.pkl + manifest.json inside).
# Override with variant=<name> for ad-hoc builds.
variant: ${cohort.name}__${preprocessing.name}

paths:
  # Base dir holding the raw `data/` and generated `outputs/` trees. null => the
  # repo root (original behaviour). Point it at the relocated copy to read/write
  # there -- e.g. on the lab server, or an SSHFS mount of it locally:
  #   python -m pipelines.build_dataset paths.root=/data1/anarghya/synapse-data
  # Also honored via $SYNAPSE_DATA_BASE (covers the non-Hydra run_quality.py).
  root: null
  # Explicit raw-recordings dir; null => <root>/data. ($SYNAPSE_DATA_ROOT also works.)
  data_root: null
  # Canonical recording per participant is resolved through synapse_qc.inventory,
  # so these only need to point at the shared assets and output location.
  # Analysis repo (published preprocessing code); override per machine with
  # $SYNAPSE_REPO when the checkout lives elsewhere.
  synapse_repo: null   # null => auto-detect (synapse_qc.paths.synapse_repo); $SYNAPSE_REPO overrides
  global_event_map: assets/global_event_id_map.pkl
  montage: assets/ceegrid_montage_head.npz   # injected into create_mne (no CWD dependency)
  # Clinical workbook for clinical_data/clinical_scores/demographics. Relative
  # paths resolve against this directory. Default: the NEWER workbook (last
  # updated 2026-07; includes EXP44-47 + CTRL26-28 and the Excluded Data /
  # per-device Questionnaires sheets). cohort=published overrides this with the
  # older ../../synapse copy the published pkl was built from (see
  # conf/cohort/published.yaml) so the faithful mirror stays faithful.
  clinical_data: 02_PCData.xlsx
  # ---- Output locations (all outputs resolve as <base>/<dir>; base comes from
  # paths.root / $SYNAPSE_DATA_BASE / the repo). Change them HERE, never in code.
  output_dir: outputs/epochs        # processed Epochs pkl variants (build_dataset)
  qc_dir: outputs/qc                # quality workbook + reports (run_quality/spotcheck)
  # The original published pkl, for the comparison step:
  published_pkl: null   # null => <synapse_repo>/processed_data/synapse_preprocessed.pkl

# Clinical questionnaire measures pulled per subject into clinical_scores.
# Matches the current published col_mapping (HQ_Functional/HQ_Social); the older
# published pkl used HQ_Fear/HQ_Sensitivity for those two — a nested relabel only.
clinical:
  measures:
    - HQ_Total
    - HQ_Functional
    - HQ_Social
    - HQ_Emotional
    - GAD_Total
    - THI_Total
    - Iowa_Total
    - Miso_Section1
    - Miso_Section2
    - Miso_Section3

tasks:
  order: [pmt, let, hlt, ast]
  # Per-task epoch windows (seconds), mirroring the published config exactly.
  timings:
    pmt: {tmin: -5, tmax: 7, stim_duration: 2}
    let: {tmin: -5, tmax: 7, stim_duration: 2}
    hlt: {tmin: -5, tmax: 7, stim_duration: 2}
    ast: {tmin: -5, tmax: 10, stim_duration: 5}
