# =============================================================================
# SYNAPSE multimodal pairing configuration (Hydra)
# =============================================================================
# Pair per-trial webcam clips with stim-locked EEG epochs for a multimodal model.
#   python -m pipelines.pair_video                                   # usable cohort, published EEG, epoch mode
#   python -m pipelines.pair_video preprocessing=drop                # different bad-channel handling
#   python -m pipelines.pair_video video.mode=marker                 # legacy marker-to-marker clips
#   python -m pipelines.pair_video preprocessing.bandpass.low=2 preprocessing.notch_freq=-1
#   python -m pipelines.pair_video cohort=published
#
# EEG parameters ARE the `preprocessing` group (shared with build_dataset), so the
# EEG stream / bandpass / notch / channel_strategy / quality / epoch_rejection are
# all configurable here and stay in lock-step with the processed-pkl variants.
# Task windows (tasks.timings) feed both the EEG epoching and the video windowing.
# =============================================================================

defaults:
  - cohort: usable             # which participant IDs to pair (conf/cohort/)
  - preprocessing: published   # EEG parameters (conf/preprocessing/) -- the variant
  - video: default             # video-pairing options (conf/video/)
  - _self_

# Keep CWD unchanged (relative paths resolve) and corral Hydra's run log under
# outputs/ instead of the repo root -- same convention as build_dataset.
hydra:
  run:
    dir: outputs/runs/${hydra.job.name}
  sweep:
    dir: outputs/runs/${hydra.job.name}
    subdir: ${hydra.job.num}
  output_subdir: null
  job:
    chdir: false

# Output goes to outputs/paired/ (flat; no variant subfolder). ``name`` is still
# recorded in the manifest for which preprocessing variant was used.
name: ${preprocessing.name}

paths:
  # Base dir holding the raw `data/` and generated `outputs/` trees. null => the
  # repo root. Point it at the relocated copy (server / SSHFS mount) to read/write
  # there:  python -m pipelines.pair_video paths.root=/data1/anarghya/synapse-data
  # Also honored via $SYNAPSE_DATA_BASE. Raw recordings: $SYNAPSE_DATA_ROOT / data_root.
  root: null
  data_root: null                                            # explicit raw dir; null => <root>/data
  synapse_repo: /Users/anarghya/Developer/research/synapse   # published EEG-alignment helpers (create_mne, events)
  montage: assets/ceegrid_montage_head.npz                   # injected into create_mne (no CWD dependency)
  paired_dir: outputs/paired

tasks:
  order: [pmt, let, hlt, ast]
  # Per-task windows (seconds rel. to stim onset). Used for BOTH the EEG epochs
  # and the video frame windows, so the two modalities are windowed identically.
  timings:
    pmt: {tmin: -5, tmax: 7, stim_duration: 2}
    let: {tmin: -5, tmax: 7, stim_duration: 2}
    hlt: {tmin: -5, tmax: 7, stim_duration: 2}
    ast: {tmin: -5, tmax: 10, stim_duration: 5}
